# PocketEmulator launcher UI tokens (TOML).
# Copy to your config directory as `launcher_theme.toml` to override (see init log on startup).
# Colors: "#RRGGBB" hex. Omit any key to keep the built-in default.

[colors]
bg = "#121214"
fg = "#f3f2f7"
surface = "#232230"
surface_2 = "#2c2a39"
surface_3 = "#383646"
border = "#544f60"
primary = "#ff4081"
primary_hover = "#ff78a8"
accent = "#7bd283"
muted_fg = "#a29bb2"
dmg_blue = "#2d7ed6"
lcd_deep = "#4aaa54"
success = "#5cd278"
warning = "#f0b834"
destructive = "#e76055"
info = "#40baec"
brand_pocket_word = "#ffe4ec"
brand_emulator_word = "#e65a96"
success_bg = "#2a4a36"
warning_bg = "#4a3a1e"
destructive_bg = "#4e2426"
info_bg = "#1a384e"
platform_bg = "#26324e"
platform_text = "#92aeff"

[spacing]
space_1 = 4
space_2 = 8
space_3 = 12
space_4 = 16

[radius]
sm = 8
lg = 12
xl = 16

[shadow]
# Section card drop shadow
blur = 16
offset_y = 4
color = "#0a0a14"
alpha = 90
