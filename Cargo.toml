[package]
name = "pocketemulator"
version = "0.1.0"
edition = "2021"
default-run = "pocketemulator"
description = "DMG Game Boy emulator (Rust)"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flexi_logger = "0.29"
log = "0.4"
thiserror = "2.0"
pixels = "0.13"
winit = "0.28"
rfd = "0.14"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }
webbrowser = "1"
cpal = "0.15"
tauri = { version = "2", features = [] }

[dev-dependencies]

[build-dependencies]
tauri-build = { version = "2", features = [] }
