name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: PocketEmulator-macos
          - os: windows-latest
            artifact_name: PocketEmulator-windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-v2

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build Tauri bundle
        run: npm --prefix frontend exec -- tauri build --config "${{ github.workspace }}/tauri.conf.json" --no-sign

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/PocketEmulator.app \
            PocketEmulator-macos.zip

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $bundle = "target/release/bundle"
          if (Test-Path $bundle) {
            Get-ChildItem -Path $bundle -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in @(".exe", ".msi", ".zip") } |
              ForEach-Object { Copy-Item $_.FullName -Destination release-artifacts -Force }
          }
          if (-not (Get-ChildItem release-artifacts -File -ErrorAction SilentlyContinue)) {
            Get-ChildItem "target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName -Destination release-artifacts -Force }
          }
          if (-not (Get-ChildItem release-artifacts -File -ErrorAction SilentlyContinue)) {
            Write-Host "target/release listing:"
            Get-ChildItem "target/release" -ErrorAction SilentlyContinue | Format-Table -AutoSize
            Write-Host "bundle tree:"
            if (Test-Path $bundle) { Get-ChildItem $bundle -Recurse -ErrorAction SilentlyContinue | Format-Table -AutoSize }
            throw "No Windows artifacts collected under release-artifacts"
          }

      - name: Upload CI artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: PocketEmulator-macos.zip

      - name: Upload CI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts
          if-no-files-found: error

  # One release upload avoids races: matrix jobs each calling gh-release can overwrite
  # the same tag release and drop the other OS assets.
  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PocketEmulator-macos
          path: release-upload

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PocketEmulator-windows
          path: release-upload/windows

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-upload/PocketEmulator-macos.zip
            release-upload/windows/*
          fail_on_unmatched_files: true
